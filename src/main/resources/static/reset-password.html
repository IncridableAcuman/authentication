<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yangi parol o'rnatish</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
<div class="auth-card">
    <div class="auth-header">
        <h2>Yangi parol o'rnatish</h2>
        <p>Iltimos, hisobingiz uchun yangi kuchli parol kiriting.</p>
    </div>

    <form id="resetPasswordForm">
        <div class="form-group">
            <label for="newPassword">Yangi parol</label>
            <input type="password" id="newPassword" placeholder="Kamida 8 ta belgi" required minlength="8">
        </div>

        <div class="form-group">
            <label for="confirmPassword">Parolni tasdiqlang</label>
            <input type="password" id="confirmPassword" placeholder="Parolni qayta kiriting" required minlength="8">
        </div>

        <button type="submit" id="submitBtn" class="btn-primary">Parolni yangilash</button>
    </form>

    <div id="errorMessage" class="alert alert-danger" style="display: none;"></div>
    <div id="successMessage" class="alert alert-success" style="display: none;"></div>

    <div class="auth-footer">
        <p><a href="/login.html">Kirish sahifasiga o'tish</a></p>
    </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/reset-password.js"></script>
</body>
</html>
