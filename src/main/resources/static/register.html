<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ro'yxatdan o'tish</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
<div class="auth-card">
    <div class="auth-header">
        <h2>Ro'yxatdan o'tish</h2>
        <p>Yangi hisob yaratish uchun ma'lumotlarni kiriting</p>
    </div>

    <form id="registerForm">
        <div class="form-row">
            <div class="form-group">
                <label for="firstName">Ism</label>
                <input type="text" id="firstName" placeholder="Ismingiz" required minlength="3">
            </div>
            <div class="form-group">
                <label for="lastName">Familiya</label>
                <input type="text" id="lastName" placeholder="Familiyangiz" required minlength="3">
            </div>
        </div>

        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="username" required minlength="3">
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="example@mail.com" required>
        </div>

        <div class="form-group">
            <label for="password">Parol</label>
            <input type="password" id="password" placeholder="Kamida 8 ta belgi" required minlength="8">
        </div>

        <button type="submit" class="btn-primary">Ro'yxatdan o'tish</button>
    </form>

    <div id="errorMessage" class="alert alert-danger" style="display: none;"></div>
    <div id="successMessage" class="alert alert-success" style="display: none;"></div>

    <div class="auth-footer">
        <p>Bunday hisob mavjudmi? <a href="/login.html">Kirish</a></p>
    </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
