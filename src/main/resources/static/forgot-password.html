<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parolni tiklash</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
<div class="auth-card">
    <div class="auth-header">
        <h2>Parolni unutdingizmi?</h2>
        <p>Ro'yxatdan o'tgan email manzilingizni kiriting. Biz parolni tiklash havolasini yuboramiz.</p>
    </div>

    <form id="forgotPasswordForm">
        <div class="form-group">
            <label for="email">Email manzil</label>
            <input type="email" id="email" placeholder="example@mail.com" required>
        </div>

        <button type="submit" id="submitBtn" class="btn-primary">Havolani yuborish</button>
    </form>

    <div id="errorMessage" class="alert alert-danger" style="display: none;"></div>
    <div id="successMessage" class="alert alert-success" style="display: none;"></div>

    <div class="auth-footer">
        <p><a href="/login.html">Login sahifasiga qaytish</a></p>
    </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/forgot-password.js"></script>
</body>
</html>
